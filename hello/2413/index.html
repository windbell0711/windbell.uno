<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>hello, 2413</title>
    <style>
        html {font-size: 18px;}

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "SimSun", "宋体", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        p {
            font-size: 1.2em;
            line-height: 1.8;
            margin: 15px 0;
            color: #4a5568;
            font-weight: bold;
        }

        del {
            font-size: 0.8em;
            text-decoration: line-through;
            text-decoration-style: double;
            padding: 2px 4px;
        }

        a {
            color: #3182ce;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ebf8ff;
            border-radius: 8px;
        }

        a:hover {
            color: #2c5282;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .signature {
            margin-top: 30px;
            font-style: italic;
            color: #718096;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>hello, 2413</h1>
        <p>欢迎来到<del>熊猫馆</del>远翔楼</p>
        <p>接过高三13班的名字和教室，愿你们能在你们的人生中找到我们</p>
        <p>我们做了一个小漂流瓶，写了一点文字，现在将它打开，送给你们</p>
        <a href="https://gift.windbell.uno/">gift.windbell.uno</a>
        <div class="signature">
            —— 2313
        </div>
    </div>
</body>
</html>
