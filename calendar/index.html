<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年夏季日历备忘录</title>
    <link rel="stylesheet" href="/calendar/style.css">
</head>
<body>
<main>
    
<h1>Schedule</h1>

<div class="calendar-container">
    <div class="calendar-grid" id="calendarGrid">
        <div class="day-headers" id="dayHeaders">
            <!-- Day headers will be inserted here -->
        </div>
        <div class="calendar-days-scroll" id="calendarDaysScroll">
            <!-- Calendar days will be inserted here -->
        </div>
    </div>
</div>

<div class="memo-container">
    <h2>备忘录详情</h2>
    <div class="memo-content" id="memoContent">点击上方日期查看记录</div>
</div>

</main>

<script type="module" src="/calendar/script.mjs"></script>
</body>
</html>
